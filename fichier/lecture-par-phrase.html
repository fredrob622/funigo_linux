<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecture phrase par phrase</title>
<style>
    body {
        background-color: #111;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
    }

    h1 {
        color: #4caf50;
        font-size: 1.3rem;
        border-bottom: 2px solid #4caf50;
        padding-bottom: 10px;
    }

    #controls-globaux {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 20px 0;
        padding: 12px;
        background-color: #1a1a1a;
        border: 1px solid #444;
        border-radius: 6px;
        font-size: 0.85rem;
    }

    select {
        background-color: #222;
        color: white;
        border: 1px solid #555;
        padding: 5px;
        border-radius: 4px;
    }

    .phrase-ligne {
        display: flex;
        align-items: center;
        gap: 12px;
        background-color: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 10px;
    }

    .phrase-texte {
        flex: 1;
        font-size: 1rem;
    }

    .btn-lire-phrase {
        background-color: #2e7d32;
        color: white;
        border: none;
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s;
    }

    .btn-lire-phrase:hover {
        background-color: #388e3c;
    }

    .phrase-ligne.en-cours {
        border-color: #4caf50;
        box-shadow: 0 0 0 1px #4caf50;
    }
</style>
</head>
<body>

<h1>Cliquer sur 🔊 pour écouter chaque phrase</h1>

<div id="controls-globaux">
    <label>
        Voix :
        <select id="select-voix"></select>
    </label>
    <label>
        Vitesse :
        <input type="range" id="vitesse" min="0.5" max="2" step="0.1" value="1">
        <span id="vitesse-valeur">1</span>
    </label>
</div>

<div id="liste-phrases">
    <div class="phrase-ligne">
        <span class="phrase-texte">Un enfant joue dans le parc.</span>
        <button class="btn-lire-phrase">🔊</button>
    </div>
    <div class="phrase-ligne">
        <span class="phrase-texte">Ce film n'est pas intéressant.</span>
        <button class="btn-lire-phrase">🔊</button>
    </div>
    <div class="phrase-ligne">
        <span class="phrase-texte">Qui a téléphoné ?</span>
        <button class="btn-lire-phrase">🔊</button>
    </div>
</div>

<script>
    const selectVoix = document.getElementById('select-voix');
    const inputVitesse = document.getElementById('vitesse');
    const vitesseValeur = document.getElementById('vitesse-valeur');
    let voixDisponibles = [];

    function chargerVoix() {
        voixDisponibles = window.speechSynthesis.getVoices();
        selectVoix.innerHTML = '';
        const voixTriees = [...voixDisponibles].sort((a, b) => {
            const aFr = a.lang.startsWith('fr') ? 0 : 1;
            const bFr = b.lang.startsWith('fr') ? 0 : 1;
            return aFr - bFr;
        });
        voixTriees.forEach(voix => {
            const option = document.createElement('option');
            option.value = voixDisponibles.indexOf(voix);
            option.textContent = `${voix.name} (${voix.lang})`;
            selectVoix.appendChild(option);
        });
    }

    chargerVoix();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = chargerVoix;
    }

    inputVitesse.addEventListener('input', () => {
        vitesseValeur.textContent = inputVitesse.value;
    });

    function lirePhrase(texte, ligneElement) {
        window.speechSynthesis.cancel();

        document.querySelectorAll('.phrase-ligne').forEach(l => l.classList.remove('en-cours'));

        const utterance = new SpeechSynthesisUtterance(texte);
        utterance.lang = 'fr-FR';
        utterance.rate = parseFloat(inputVitesse.value);

        const voixChoisie = voixDisponibles[selectVoix.value];
        if (voixChoisie) utterance.voice = voixChoisie;

        utterance.onstart = () => ligneElement.classList.add('en-cours');
        utterance.onend = () => ligneElement.classList.remove('en-cours');

        window.speechSynthesis.speak(utterance);
    }

    document.querySelectorAll('.phrase-ligne').forEach(ligne => {
        const bouton = ligne.querySelector('.btn-lire-phrase');
        const texte = ligne.querySelector('.phrase-texte').textContent;

        bouton.addEventListener('click', () => {
            lirePhrase(texte, ligne);
        });
    });
</script>

</body>
</html>
